<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dramadex{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<style>
  :root {
    --bg: #fbfbfd; --fg: #14161a; --muted: #6b7280; --line: #e3e6ec;
    --card: #ffffff; --accent: #4f46e5; --ok: #047857; --warn: #b45309; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e8eaed; --muted: #9aa1ac; --line: #262b33;
      --card: #171a20; --accent: #818cf8; --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { border-bottom: 1px solid var(--line); background: var(--card); }
  nav { max-width: 1100px; margin: 0 auto; padding: .85rem 1.25rem; display: flex;
        gap: 1.25rem; align-items: baseline; flex-wrap: wrap; }
  nav .brand { font-weight: 650; letter-spacing: -.01em; margin-right: .5rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a.on { color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.35rem; letter-spacing: -.02em; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .75rem; color: var(--muted);
       text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; }
  .card .n { font-size: 1.6rem; font-weight: 620; letter-spacing: -.02em; }
  .card .k { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  td.wrapcell { white-space: normal; max-width: 34rem; }
  a { color: var(--accent); }
  .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px;
          font-size: .74rem; font-weight: 600; border: 1px solid var(--line); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .muted { color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  form.inline { display: inline; }
  button, select, input[type=text] {
    font: inherit; padding: .35rem .7rem; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
         padding: .7rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1.25rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
</style>
</head>
<body>
<header><nav>
  <a href="/admin" class="brand" style="display:flex;align-items:center;gap:.45rem;text-decoration:none;color:var(--fg)">
    <img src="/static/favicon.svg" alt="" width="22" height="22" style="border-radius:5px">Dramadex</a>
  <a href="/admin">Dashboard</a>
  <a href="/admin/runs">Runs</a>
  <a href="/admin/titles">Titles</a>
  <a href="/admin/matches">Matches</a>
  <a href="/admin/merges">Duplicates</a>
  <a href="/admin/quarantine">Quarantine</a>
  <a href="/docs">API</a>
</nav></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
