[project]
name = "dramadex"
version = "0.1.0"
description = "A self-hosted indexer for vertical short-drama metadata"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "protego>=0.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
dramadex = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real source sites; run manually, never in CI",
]
addopts = "-m 'not live'"
