{% macro button(url, label) %}
<tr>
  <td style="padding:16px 28px 6px;">
    <a href="{{ url }}" style="display:inline-block;background:#5b6ef5;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 26px;border-radius:9px;">{{ label }}</a>
  </td>
</tr>
{% endmacro %}

{% macro fallback_link(url, label) %}
<p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#71717f;">
  {{ label }}<br />
  <span style="color:#5b6ef5;word-break:break-all;">{{ url }}</span>
</p>
{% endmacro %}
