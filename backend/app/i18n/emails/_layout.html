<!doctype html>
<html lang="{{ locale | default('en') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f6;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <tr>
              <td style="background:#1b1d29;padding:20px 28px;">
                <span style="color:#ffffff;font-size:17px;font-weight:600;letter-spacing:0.02em;">{{ site_name }}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 28px 0;">
                <h1 style="margin:0 0 14px;font-size:21px;line-height:1.3;color:#1b1d29;font-weight:600;">{% block heading %}{% endblock %}</h1>
                {% block body %}{% endblock %}
              </td>
            </tr>
            {% block action %}{% endblock %}
            <tr>
              <td style="padding:4px 28px 28px;">{% block after %}{% endblock %}</td>
            </tr>
            <tr>
              <td style="padding:18px 28px;background:#f7f7f9;border-top:1px solid #ececf1;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#8a8a99;">{% block footer %}{% endblock %}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
