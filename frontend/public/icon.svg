<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DramatArr">
  <title>DramatArr</title>
  <!--
    A film reel with a strip pulling out of it, in the gold-on-blue of the reference.

    Drawn rather than traced. The reference is a rendered illustration — a laptop, a lion, a
    rocket, a couple mid-waltz — and at 32 pixels, which is where a favicon actually lives,
    every one of those is three grey specks. So this keeps only what survives that size: the
    reel's silhouette, its spokes, and one ribbon of film. The frames on that ribbon are taller
    than they are wide, which is a quiet nod to what this library actually holds.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffdf8d" />
      <stop offset="0.55" stop-color="#f0b842" />
      <stop offset="1" stop-color="#cf8c1c" />
    </linearGradient>
    <linearGradient id="steel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5878b4" />
      <stop offset="1" stop-color="#2a3d63" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1b2b४a" />
      <stop offset="1" stop-color="#0f1a2e" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#16233d" />

  <!-- The strip, behind the reel so the reel reads as sitting in front of it. -->
  <g>
    <path d="M214 322
             C 268 300, 300 372, 356 356
             C 404 342, 424 300, 462 300
             L 462 372
             C 442 372, 430 400, 386 418
             C 322 444, 276 388, 232 402 Z"
          fill="url(#gold)" />
    <!-- Sprocket holes, both edges, following the wave. -->
    <g fill="#16233d" opacity="0.9">
      <rect x="248" y="330" width="13" height="13" rx="3" transform="rotate(-14 254 336)" />
      <rect x="292" y="344" width="13" height="13" rx="3" transform="rotate(4 298 350)" />
      <rect x="340" y="352" width="13" height="13" rx="3" transform="rotate(10 346 358)" />
      <rect x="392" y="340" width="13" height="13" rx="3" transform="rotate(-8 398 346)" />
      <rect x="438" y="312" width="13" height="13" rx="3" />
      <rect x="252" y="384" width="13" height="13" rx="3" transform="rotate(-14 258 390)" />
      <rect x="296" y="398" width="13" height="13" rx="3" transform="rotate(4 302 404)" />
      <rect x="344" y="404" width="13" height="13" rx="3" transform="rotate(10 350 410)" />
      <rect x="396" y="392" width="13" height="13" rx="3" transform="rotate(-8 402 398)" />
      <rect x="438" y="358" width="13" height="13" rx="3" />
    </g>
    <!-- Two frames, portrait, which is the shape this library is made of. -->
    <g fill="#16233d" opacity="0.55">
      <rect x="268" y="350" width="26" height="40" rx="4" transform="rotate(-4 281 370)" />
      <rect x="318" y="360" width="26" height="40" rx="4" transform="rotate(6 331 380)" />
      <rect x="370" y="352" width="26" height="40" rx="4" transform="rotate(-2 383 372)" />
    </g>
  </g>

  <!-- The reel. -->
  <circle cx="216" cy="222" r="150" fill="url(#gold)" />
  <circle cx="216" cy="222" r="126" fill="url(#steel)" />

  <!-- Six spokes: narrow bars with rounded ends, not petals. -->
  <g transform="translate(216 222)" fill="url(#gold)">
    <g><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
    <g transform="rotate(60)"><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
    <g transform="rotate(120)"><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
    <g transform="rotate(180)"><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
    <g transform="rotate(240)"><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
    <g transform="rotate(300)"><rect x="-15" y="-116" width="30" height="86" rx="15" /></g>
  </g>

  <circle cx="216" cy="222" r="40" fill="url(#gold)" />
  <circle cx="216" cy="222" r="15" fill="#16233d" />
</svg>
