server {
    # Both families on purpose: with IPv4 only, anything inside the container that resolves
    # `localhost` to ::1 first — BusyBox wget, which the healthcheck uses — gets connection
    # refused against a server that is in fact serving perfectly.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video files are large; the default 1m would reject nothing here but keeps intent clear.
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json text/vtt;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # nginx's bundled mime.types has no .webmanifest entry, so it would go out as
    # application/octet-stream and browsers would ignore it. This must be a `location` rather
    # than a `types` block: a `types` block inside `server` REPLACES the inherited map
    # wholesale, which silently breaks the content type of every image on the site.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Hashed asset filenames make these safe to cache forever.
    # `expires` would emit its own Cache-Control alongside this one, and two of the header
    # on a response is ambiguous for intermediaries — so max-age is spelled out here instead.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Server-sent events for the admin queue. Buffering here would hold every progress event
    # until the connection closed, which would make the live queue appear frozen.
    location = /api/admin/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Video streaming. Buffering must stay off so range requests are passed straight through
    # and seeking stays responsive instead of waiting on nginx to fill a buffer.
    location /api/stream/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA fallback: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
